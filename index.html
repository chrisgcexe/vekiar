<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Vékiar</title>
    <!-- CSS en archivo separado -->
     <!--1 css general-->
    <link rel="stylesheet" href="./css/style.css">
        <!--css de la interfaz de usuario-->
    <link rel="stylesheet" href="./css/Ui.css">
        <!--css de la brújula-->
    <link rel="stylesheet" href="./css/Compass.css">
    
    <!--css pantalla de carga-->
    <link rel="stylesheet" href="./css/loader.css">

    <!-- css editor de mapas-->
    <link rel="stylesheet" href="./css/MapEditor.css">

    <!-- css etiquetas de marcadores (CSS2DRenderer) -->
    <link rel="stylesheet" href="./css/markers.css">

</head>
<body>
    <div id="ui">
<!-- Prompt interactivo -->
    <div id="idle-prompt">
        <h2>Explora Vékiar</h2>
        <button id="btn-start">Comenzar</button>
    </div>
    
    <!-- Botón para ocultar/mostrar marcadores 3D -->
    <button id="btn-toggle-markers" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; padding: 8px 12px; background: rgba(23, 19, 16, 0.8); color: #d7ccc8; border: 1px solid #795548; cursor: pointer; border-radius: 4px; font-family: sans-serif; font-size: 12px; display: none; pointer-events: auto;">Ocultar Marcadores</button>
    </div>
<!-- Pantalla de carga -->
<div id="loader">
    <div class="loader-content">
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>
</div>

    <!-- Efecto Viñeta (Atmósfera) -->
    <div id="vignette"></div>

    <div id="compass">
        <div class="dir n">N</div>
        <div class="dir s">S</div>
        <div class="dir e">E</div>
        <div class="dir w">O</div>
        <div class="center-dot"></div>
    </div>

    <!-- Mapeo de Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Script separado -->
    <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
